<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fine line</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Nanum+Brush+Script&display=swap"
      rel="stylesheet"
    />
    <!-- Inline so the page doesn't 404 on /favicon.ico. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F4F1EA'/%3E%3Cpath d='M7 22 L20 7 l5 5 L12 27 L6 28 Z' fill='none' stroke='%232B2B2B' stroke-width='2'/%3E%3Cpath d='M4 29 h26' stroke='%233B6EA5' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2b2b2b;
        font-family: 'Nanum Brush Script', cursive;
        font-size: 18px;
        letter-spacing: 0.08em;
      }
      /*
       * The accessibility layer holds transparent <button>s positioned over the
       * canvas so screen readers and Tab order work (see src/systems/a11y.ts).
       * They must stay invisible but focusable — never display:none the layer.
       */
      #a11y-layer button:focus-visible {
        outline: 3px solid #2b2b2b;
        outline-offset: 2px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="loading">loading…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
