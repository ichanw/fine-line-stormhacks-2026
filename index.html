<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>a quiet weather</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #e9e5db;
        /* darker paper surround so the 1280x720 canvas reads as a page */
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Simple pre-boot message, replaced once Phaser mounts */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2b2b2b;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 18px;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="loading">loading…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
